<!DOCTYPE html>
<!--
  ARTICLE TEMPLATE. Copy this file, don't edit it in place.

    1. cp articles/_template.html articles/my-slug.html
    2. Replace every {{PLACEHOLDER}} below.
    3. Write the article inside <div class="post-body">.
    4. Add a matching row to the <ol class="articles"> list in index.html.

  The og:* tags are what LinkedIn reads to build the preview card when you
  paste the link. They must be ABSOLUTE URLs; relative paths are ignored.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png" />
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />

<title>{{TITLE}} · Josué Aldana-Aguilar</title>
<meta name="description" content="{{ONE_SENTENCE_SUMMARY}}" />
<meta name="author" content="Josué Romeo Aldana Aguilar" />

<meta property="og:type" content="article" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{ONE_SENTENCE_SUMMARY}}" />
<meta property="og:url" content="https://scitechlab-dev.com/articles/{{SLUG}}.html" />
<meta property="og:image" content="https://scitechlab-dev.com/assets/share.png" />
<meta property="article:published_time" content="{{YYYY-MM-DD}}" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="canonical" href="https://scitechlab-dev.com/articles/{{SLUG}}.html" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/style.css?v=7" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="../index.html">Josué Aldana-Aguilar</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="../index.html#work">Work</a>
      <a href="../index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="main">
  <article class="post">
    <div class="wrap post-inner">
      <a class="post-back" href="../index.html">← Home</a>

      <p class="post-meta">
        <time datetime="{{YYYY-MM-DD}}">{{YYYY-MM-DD}}</time>
        <span>{{TOPIC, e.g. Grid operations}}</span>
      </p>

      <h1>{{TITLE}}</h1>

      <div class="post-body">
        <p>{{Opening paragraph.}}</p>

        <h2>{{Section heading}}</h2>
        <p>{{Body text.}}</p>
        <ul>
          <li>{{List item}}</li>
        </ul>
      </div>
    </div>
  </article>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>Josué Aldana-Aguilar</span>
    <span class="footer-meta">San Salvador · <span id="year"></span></span>
  </div>
</footer>

<script src="../assets/main.js?v=5"></script>
</body>
</html>
