<!DOCTYPE html>
<!--
  GENERATED FILE — do not edit articles/*.html by hand, your changes are
  overwritten on the next build. Edit the markdown in content/ instead, or
  this template if you want to change the shell every article shares.

  The og:* tags are what LinkedIn reads to build the preview card when you
  paste the link. They must be ABSOLUTE URLs; relative paths are ignored.
-->
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=7" />
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png?v=7" />
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png?v=7" />

<title>{{TITLE}}</title>
<meta name="description" content="{{SUMMARY}}" />
<meta name="author" content="Josué Romeo Aldana Aguilar" />

<meta property="og:type" content="article" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{SUMMARY}}" />
<meta property="og:url" content="https://scitechlab-dev.com/articles/{{SLUG}}" />
<meta property="og:image" content="https://scitechlab-dev.com/assets/share.png" />
<meta property="article:published_time" content="{{DATE}}" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="canonical" href="https://scitechlab-dev.com/articles/{{SLUG}}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/style.css?v={{STYLE_V}}" />{{MATH_HEAD}}
</head>
<body>
<a class="skip-link" href="#main">{{T_SKIP}}</a>

<!-- Same drawing sheet as the home page: one bordered plate on grey paper. -->
<div class="sheet">

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="../">Josué Aldana-Aguilar</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="../#work">{{T_WORK}}</a>
      <a href="../articles/">{{T_WRITING}}</a>
      <a href="../#contact">{{T_CONTACT}}</a>
    </nav>
  </div>
</header>

<main id="main">
  <article class="post">
    <div class="wrap post-inner">
      <a class="post-back" href="../articles/">{{T_BACK}}</a>

      <p class="post-meta">
        <time datetime="{{DATE}}">{{DATE}}</time>{{TOPIC}}
      </p>{{SERIE_CRUMB}}

      <h1>{{TITLE}}</h1>{{TOC}}

      <div class="post-body">
{{CONTENT}}
      </div>{{SERIE_NAV}}
    </div>
  </article>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>Josué Aldana-Aguilar</span>
    <span class="footer-meta">San Salvador · <span id="year"></span></span>
  </div>
</footer>

</div><!-- /.sheet -->

<script src="../assets/main.js?v={{MAIN_V}}"></script>
</body>
</html>
