<!DOCTYPE html>
<!--
  GENERATED FILE — do not edit anything under dist/ by hand, your changes are
  overwritten on the next build.

  The shell every standalone page shares: pages/*.md (rendered markdown) and
  series/*.yml (a generated running order). It is deliberately the article shell
  minus the dated article furniture — no <time>, no topic chip, no "back to
  Writing" link — because these pages are not entries in the archive.

  {{UP}} is the prefix back to the site root: empty for a page at /<slug>, and
  "../" for one nested under /serie/. Every same-site href and asset path in
  here must go through it, or the page works at one depth and 404s at the other.
-->
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="{{UP}}assets/favicon.svg?v=7" />
<link rel="icon" type="image/png" sizes="64x64" href="{{UP}}assets/favicon.png?v=7" />
<link rel="apple-touch-icon" href="{{UP}}assets/apple-touch-icon.png?v=7" />

<title>{{TITLE}}</title>
<meta name="description" content="{{SUMMARY}}" />
<meta name="author" content="Josué Romeo Aldana Aguilar" />

<meta property="og:type" content="article" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{SUMMARY}}" />
<meta property="og:url" content="https://scitechlab-dev.com/{{SLUG}}" />
<meta property="og:image" content="https://scitechlab-dev.com/assets/share.png" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="canonical" href="https://scitechlab-dev.com/{{SLUG}}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{UP}}assets/style.css?v={{STYLE_V}}" />{{MATH_HEAD}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="sheet">

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{UP}}">Josué Aldana-Aguilar</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{UP}}#work">Work</a>
      <a href="{{UP}}articles/">Writing</a>
      <a href="{{UP}}#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="main">
  <article class="post">
    <div class="wrap post-inner">
      <h1>{{TITLE}}</h1>
      <p class="page-lede">{{SUMMARY}}</p>

      <div class="post-body">
{{CONTENT}}
      </div>
    </div>
  </article>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>Josué Aldana-Aguilar</span>
    <span class="footer-meta">San Salvador · <span id="year"></span></span>
  </div>
</footer>

</div><!-- /.sheet -->

<script src="{{UP}}assets/main.js?v={{MAIN_V}}"></script>
</body>
</html>
