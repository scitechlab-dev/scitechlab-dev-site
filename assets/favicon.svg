<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- JA badge. A rounded plate, a white keyline inset from its edge, and the
       two initials inside it — the construction Schweitzer Engineering Labs
       uses for the SEL mark, which is the reference the owner asked for.

       Greyscale, and only site tokens: the plate is ink #14161a and everything
       on it is on-ink #ffffff, 18.4:1. It replaced a version on the accent-2
       teal. Of the greys available this is the only pairing that stays crisp at
       16px; ink-dim #565a63 under white goes muddy, and a plate one step up
       from ink at #2b2f36 sinks into the background of a dark tab.

       This mark carries the tab alone: the page title is deliberately blank, so
       nothing but this identifies the tab. Greyscale gives up the trick of being
       recognised by hue, so it leans entirely on silhouette and contrast — which
       is exactly why the plate has to be the darkest token and not a mid grey.
       A solid near-black block reads as one thing on a light strip and on a dark
       one; a grey block reads as neither.

       Geometry on the 64 grid. Plate radius 8. The keyline is inset 3.5 at
       stroke 4, so it occupies 1.5 to 5.5 and still resolves to a clean 1px at
       16. The letters sit in x 10..54 and y 15..49 at stroke 7.5, which leaves
       4.5 units of air between the keyline and the J — a badge is the one place
       the mark may not run full bleed, and crowding the keyline is what makes
       these look muddy. Nothing may go below 7 units.

       Careful: XML forbids a double hyphen inside a comment, so write CSS
       custom property names without their leading dashes in here. An invalid
       comment makes the whole file unparseable and every browser silently
       falls back to the PNG.

       If you redraw it, judge it at 16px inside a mock tab strip with no title
       text beside it, which is how it actually ships. -->
  <rect width="64" height="64" rx="8" fill="#14161a"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="6" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M26.25 18.75V39a6.25 6.25 0 0 1-12.5 0" fill="none" stroke="#ffffff"
        stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37.75 45.25 44 19l6.25 26.25M39.1 39.5h9.8" fill="none" stroke="#ffffff"
        stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
