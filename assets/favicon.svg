<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- JA monogram at the site's stroke weight: J in ink, A in the signal
       amber, on the true-black plate with one hairline.

       Nothing here is thinner than 5 units on a 64 grid, which is what
       survives being scaled down to a 16px browser tab. If you redraw it,
       check it at 16px first, not at 64. -->
  <rect width="64" height="64" rx="13" fill="#000000"/>
  <rect x="1" y="1" width="62" height="62" rx="12" fill="none" stroke="#1d1d21" stroke-width="2"/>
  <path d="M14 16h13v22a8 8 0 0 1-13 6" fill="none" stroke="#f6f6f8"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 47 44 16l10 31M37.5 38h13" fill="none" stroke="#ffb000"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
