<rect x="60" y="360" width="1080" height="132" rx="8" fill="#ffffff" stroke="#8a5200" stroke-width="1.6" />
<text x="82" y="388" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#8a5200" text-anchor="start">Y el argumento que evita el error más caro: validate=</text>
<text x="82" y="414" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#14161a" text-anchor="start">Si en la tabla derecha se cuela UN duplicado de 2008Q3, el merge no falla: devuelve 5 filas en vez de 4.</text>
<text x="82" y="434" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">La fila extra no se ve, no rompe nada, y cualquier suma posterior queda inflada. El error aparece tres pasos después,</text>
<text x="82" y="454" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">como un total que no cuadra y que ya nadie asocia con el merge.</text>
<text x="82" y="478" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600" fill="#14161a" text-anchor="start">izq.merge(der, on="trimestre", how="left", validate="one_to_one")   →   MergeError, en vez de una fila de más</text>
<text x="60" y="540" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">Los cuatro valores admitidos son one_to_one, one_to_many, many_to_one y many_to_many. Declarar cuál se espera cuesta doce</text>
<text x="60" y="558" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">caracteres y convierte un error silencioso en una excepción. Es el mismo criterio que gobierna el validador de la serie del</text>
<text x="60" y="576" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">mercado eléctrico: si el sistema puede detectar que un supuesto se violó, tiene que fallar, no adivinar.</text>
</svg>