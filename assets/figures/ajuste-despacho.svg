<text x="60" y="38" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#14161a" text-anchor="start">Dos causas mueven el CVNC, y la más grande no es la inflación</text>
<text x="60" y="60" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#6e737e" text-anchor="start">la misma máquina, el mismo año base, y un régimen de despacho distinto</text>
<rect x="60" y="96" width="340" height="128" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="60" y="96" width="340" height="3" rx="1.5" fill="#0e7490" stroke="none" stroke-width="1.2" />
