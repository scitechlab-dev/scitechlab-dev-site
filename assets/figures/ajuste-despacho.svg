<text x="78" y="143" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e737e" text-anchor="start">sobre el que se calculó el CVNC</text>
<text x="78" y="172" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#565a63" text-anchor="start">energía neta   320 GWh</text>
<text x="78" y="191" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#565a63" text-anchor="start">horas de operación   6400 h</text>
<text x="78" y="212" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="600" fill="#0e7490" text-anchor="start">carga media   50 MW</text>
