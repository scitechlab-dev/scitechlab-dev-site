<text x="60" y="596" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">Solo el mantenimiento se reescala: es el único componente cuyo costo por MWh depende de cuántas horas se operó para entregar esa energía.</text>
