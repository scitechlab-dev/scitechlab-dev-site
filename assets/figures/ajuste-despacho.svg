<rect x="440" y="96" width="340" height="3" rx="1.5" fill="#8a5200" stroke="none" stroke-width="1.2" />
<text x="458" y="124" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Últimos doce meses</text>
<text x="458" y="143" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e737e" text-anchor="start">medidos por el SIMEC</text>
<text x="458" y="172" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#565a63" text-anchor="start">energía neta   248 GWh</text>
<text x="458" y="191" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#565a63" text-anchor="start">horas de operación   6900 h</text>
<text x="458" y="212" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="600" fill="#8a5200" text-anchor="start">carga media   35.9 MW</text>
<rect x="820" y="96" width="320" height="128" rx="6" fill="#ffffff" stroke="#b4b9c2" stroke-width="1.2" />
<text x="838" y="124" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">El factor de ajuste</text>
<text x="838" y="152" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#565a63" text-anchor="start">Ea/E12 · HO12/HOa</text>
<text x="838" y="176" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#14161a" text-anchor="start">1.2903 · 1.0781 = 1.3911</text>
<text x="838" y="202" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e737e" text-anchor="start">más horas por cada MWh entregado</text>
