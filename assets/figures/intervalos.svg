<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect width="1200" height="480" fill="#ffffff" />
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14161a" /></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5200" /></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7490" /></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e737e" /></marker></defs>
<text x="60" y="38" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#14161a" text-anchor="start">El intervalo también se evalúa, y este no pasó</text>
<text x="60" y="60" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">un pronóstico puntual no le sirve a quien tiene que decidir cuánta reserva programar; uno con intervalo mal calibrado, tampoco</text>
<rect x="60" y="130" width="640" height="44" rx="5" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="60" y="130" width="376.32" height="44" rx="5" fill="#8a5200" stroke="none" stroke-width="1.2" />
<line x1="572" y1="116" x2="572" y2="188" stroke="#14161a" stroke-width="2.4" stroke-linecap="round" />
<text x="572" y="108" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#14161a" text-anchor="middle">nominal 80 %</text>
<text x="76" y="158" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">58.8 % observada</text>
<text x="60" y="208" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">De cada cien días, el valor real cayó dentro de la banda P10 a P90 solo en 59. Debería haber caído en 80.</text>
<text x="60" y="228" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#8a5200" text-anchor="start">La banda es demasiado angosta: el modelo cree saber más de lo que sabe.</text>
<text x="760" y="156" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">877 MWh</text>
<text x="760" y="176" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">ancho medio</text>
<text x="760" y="192" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#6e737e" text-anchor="start">P90 menos P10</text>
<text x="900" y="156" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">113.5</text>
<text x="900" y="176" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">pinball P10</text>
<text x="900" y="192" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#6e737e" text-anchor="start">menor es mejor</text>
<text x="1040" y="156" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="18" font-weight="600" fill="#14161a" text-anchor="start">119.4</text>
<text x="1040" y="176" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">pinball P90</text>
<text x="1040" y="192" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#6e737e" text-anchor="start">menor es mejor</text>
<line x1="60" y1="290" x2="1140" y2="290" stroke="#d7dae0" stroke-width="1.4" stroke-linecap="round" />
<text x="60" y="318" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Qué hacer con eso</text>
<circle cx="66" cy="340" r="3" fill="#8a5200" />
<text x="80" y="344" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">Reportarlo. Un intervalo con 59 % de cobertura no es un intervalo del 80 %, y presentarlo como tal es peor que no dar intervalo.</text>
<circle cx="66" cy="366" r="3" fill="#8a5200" />
<text x="80" y="370" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">Calibrarlo. Ajustar los cuantiles sobre un conjunto de calibración aparte, o ensanchar la banda por el factor que la corrida sugiere.</text>
<circle cx="66" cy="392" r="3" fill="#8a5200" />
<text x="80" y="396" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">Sospechar de la causa. Los residuos de esta serie están autocorrelacionados, y un modelo que asume independencia entre días subestima</text>
<text x="80" y="422" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">la varianza acumulada del horizonte. La regresión cuantílica no arregla eso sola.</text>
<text x="60" y="452" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">Reportar la cobertura observada al lado de la nominal es lo mínimo que separa un pronóstico probabilístico de un adorno.</text>
</svg>