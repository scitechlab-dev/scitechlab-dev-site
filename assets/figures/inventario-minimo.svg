<line x1="60" y1="470" x2="1140" y2="470" stroke="#d7dae0" stroke-width="1.4" stroke-linecap="round" />
<text x="60" y="496" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">Para factor de planta menor que 0.75 el piso es el mayor entre los días de la barra y el consumo de la programación semanal más 35 %.</text>
<text x="60" y="516" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">Quien no lo cumple no recibe una multa: se le penaliza la tasa de salida forzada con horas de indisponibilidad equivalente por déficit de</text>
<text x="60" y="536" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">combustible, medidas a las 00:00 del lunes, y eso le baja la capacidad firme que cobra (Anexo 04, 9.4, con el Anexo 15).</text>
