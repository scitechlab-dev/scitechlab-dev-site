<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img"
     aria-label="Radial 13.8 kV feeder with four nodes: R1 at the substation, R2 at 3 km, R3 at 8 km and a fuse at 12 km.">
<rect width="760" height="210" fill="#ffffff"/>
<line x1="26" y1="84" x2="84" y2="84" stroke="#14161a" stroke-width="2"/>
<circle cx="26" cy="84" r="9" fill="none" stroke="#14161a" stroke-width="2"/>
<text x="26" y="64" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#565a63">250 MVA</text>
<text x="26" y="114" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#6e737e">13.8 kV</text>
<line x1="84" y1="84" x2="690" y2="84" stroke="#14161a" stroke-width="2"/>
<rect x="75" y="75" width="18" height="18" fill="#ffffff" stroke="#8a5200" stroke-width="2.2"/>
<text x="84" y="60" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#14161a">R1</text>
<text x="84" y="118" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#14161a">A · 0 km</text>
<text x="84" y="134" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#0e7490">10 500 A</text>
<circle cx="235.5" cy="84" r="9" fill="#ffffff" stroke="#8a5200" stroke-width="2.2"/>
<text x="235.5" y="60" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#14161a">R2</text>
<text x="235.5" y="118" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#14161a">B · 3 km</text>
<text x="235.5" y="134" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#0e7490">3 855 A</text>
<circle cx="488" cy="84" r="9" fill="#ffffff" stroke="#8a5200" stroke-width="2.2"/>
<text x="488" y="60" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#14161a">R3</text>
<text x="488" y="118" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#14161a">C · 8 km</text>
<text x="488" y="134" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#0e7490">1 839 A</text>
<rect x="685" y="73" width="10" height="22" fill="#ffffff" stroke="#565a63" stroke-width="2"/>
<text x="690" y="60" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#14161a">Fuse</text>
<text x="690" y="118" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#14161a">D · 12 km</text>
<text x="690" y="134" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#0e7490">1 295 A</text>
<text x="159.75" y="162" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#6e737e">×2.72</text>
<text x="361.75" y="162" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#6e737e">×2.10</text>
<text x="589" y="162" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#8a5200">×1.42</text>
<text x="84" y="182" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" fill="#6e737e">Fault-current ratio between adjacent nodes. Below 1.5, current grading stops working.</text>
</svg>