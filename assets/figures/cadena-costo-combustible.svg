<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
<rect width="1200" height="660" fill="#ffffff" />
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14161a" /></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5200" /></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7490" /></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e737e" /></marker></defs>
<text x="60" y="38" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#14161a" text-anchor="start">El recorrido de un dato, de la auditoría al precio de una hora</text>
<rect x="60" y="66" width="4" height="130" rx="2" fill="#0e7490" stroke="none" stroke-width="1.2" />
<text x="76" y="86" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0e7490" text-anchor="start" letter-spacing="0.08em">CADA DOS AÑOS</text>
<text x="76" y="106" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">auditoría y aprobación</text>
<rect x="250" y="66" width="290" height="130" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="250" y="66" width="290" height="3" rx="1.5" fill="#0e7490" stroke="none" stroke-width="1.2" />
<text x="268" y="96" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Auditoría de consumo de calor</text>
<text x="268" y="120" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">auditor externo del registro de la UT,</text>
<text x="268" y="137" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">con la UT como observador</text>
<text x="268" y="182" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 16, 2.2 y 2.8</text>
<line x1="545" y1="131" x2="561" y2="131" stroke="#b4b9c2" stroke-width="1.6" marker-end="url(#ah-dim)" stroke-linecap="round" />
<rect x="566" y="66" width="290" height="130" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="566" y="66" width="290" height="3" rx="1.5" fill="#0e7490" stroke="none" stroke-width="1.2" />
<text x="584" y="96" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Polinomio de consumo específico</text>
<text x="584" y="120" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">C_ESP(P) = a + bP + cP²,</text>
<text x="584" y="137" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">mínimos cuadrados sobre 5 puntos o más</text>
<text x="584" y="182" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 16, ap. 3, 2.2</text>
<line x1="861" y1="131" x2="877" y2="131" stroke="#b4b9c2" stroke-width="1.6" marker-end="url(#ah-dim)" stroke-linecap="round" />
<rect x="882" y="66" width="290" height="130" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="882" y="66" width="290" height="3" rx="1.5" fill="#0e7490" stroke="none" stroke-width="1.2" />
<text x="900" y="96" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Estructura de costos del combustible</text>
<text x="900" y="120" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">fuente internacional, fórmula FOB,</text>
<text x="900" y="137" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">costos de internación y su actualización</text>
<text x="900" y="182" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 04, 4.1 y 4.3</text>
<line x1="395" y1="202" x2="395" y2="260" stroke="#b4b9c2" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah-dim)" stroke-linecap="round" />
<text x="411" y="236" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">la estructura aprobada es la referencia contra la que se valida cada semana</text>
<rect x="60" y="268" width="4" height="130" rx="2" fill="#8a5200" stroke="none" stroke-width="1.2" />
<text x="76" y="288" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#8a5200" text-anchor="start" letter-spacing="0.08em">CADA SEMANA</text>
<text x="76" y="308" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">declaración y validación</text>
<rect x="250" y="268" width="290" height="130" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="250" y="268" width="290" height="3" rx="1.5" fill="#8a5200" stroke="none" stroke-width="1.2" />
<text x="268" y="298" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">El generador reporta su PCpep</text>
<text x="268" y="322" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">jueves antes de las 10:00. Se publica</text>
<text x="268" y="339" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">cada mañana; no entra al despacho</text>
<text x="268" y="384" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 04, 10.1 y 11.1</text>
<line x1="545" y1="333" x2="561" y2="333" stroke="#b4b9c2" stroke-width="1.6" marker-end="url(#ah-dim)" stroke-linecap="round" />
<rect x="566" y="268" width="290" height="130" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="566" y="268" width="290" height="3" rx="1.5" fill="#8a5200" stroke="none" stroke-width="1.2" />
<text x="584" y="298" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">La UT calcula el precio que despacha</text>
<text x="584" y="322" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">aplica la fórmula aprobada sobre la</text>
<text x="584" y="339" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">referencia internacional publicada</text>
<text x="584" y="384" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 04, 3.1 y 7.1</text>
<line x1="861" y1="333" x2="877" y2="333" stroke="#b4b9c2" stroke-width="1.6" marker-end="url(#ah-dim)" stroke-linecap="round" />
<rect x="882" y="268" width="290" height="130" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="882" y="268" width="290" height="3" rx="1.5" fill="#8a5200" stroke="none" stroke-width="1.2" />
<text x="900" y="298" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Lunes: variación de inventarios</text>
<text x="900" y="322" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">existencia a las cero horas, con tablas</text>
<text x="900" y="339" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">de calibración auditadas</text>
<text x="900" y="384" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 04, 8.2</text>
<line x1="395" y1="404" x2="395" y2="462" stroke="#b4b9c2" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah-dim)" stroke-linecap="round" />
<text x="411" y="438" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">al modelo entra el precio que calcula la UT, no el que reporta el generador</text>
<rect x="60" y="470" width="4" height="130" rx="2" fill="#14161a" stroke="none" stroke-width="1.2" />
<text x="76" y="490" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#14161a" text-anchor="start" letter-spacing="0.08em">CADA HORA</text>
<text x="76" y="510" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">despacho y precio</text>
<rect x="250" y="470" width="290" height="130" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="250" y="470" width="290" height="3" rx="1.5" fill="#14161a" stroke="none" stroke-width="1.2" />
<text x="268" y="500" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Costo variable de la unidad</text>
<text x="268" y="524" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">CVC = C_ESP × PCpep, evaluado a</text>
<text x="268" y="541" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">potencia máxima neta menos reserva</text>
<text x="268" y="586" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 09, 3.1.5</text>
<line x1="545" y1="535" x2="561" y2="535" stroke="#b4b9c2" stroke-width="1.6" marker-end="url(#ah-dim)" stroke-linecap="round" />
<rect x="566" y="470" width="290" height="130" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="566" y="470" width="290" height="3" rx="1.5" fill="#14161a" stroke="none" stroke-width="1.2" />
<text x="584" y="500" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Orden de mérito en el SAM</text>
<text x="584" y="524" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">el parque se ordena por costo variable</text>
<text x="584" y="541" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">y se despacha a mínimo costo</text>
<text x="584" y="586" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">ROBCP, 10.1.1 y 10.2.1</text>
<line x1="861" y1="535" x2="877" y2="535" stroke="#b4b9c2" stroke-width="1.6" marker-end="url(#ah-dim)" stroke-linecap="round" />
<rect x="882" y="470" width="290" height="130" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="882" y="470" width="290" height="3" rx="1.5" fill="#14161a" stroke="none" stroke-width="1.2" />
<text x="900" y="500" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Precio del MRS</text>
<text x="900" y="524" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">costo marginal de operación más los</text>
<text x="900" y="541" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">cargos del sistema</text>
<text x="900" y="586" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 09, 3.3.1</text>
</svg>