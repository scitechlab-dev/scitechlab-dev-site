<text x="60" y="38" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#14161a" text-anchor="start">El agua no tiene precio: tiene costo de oportunidad, y sube cuando el embalse baja</text>
<text x="60" y="60" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">por eso una hidro de embalse se mueve dentro del orden de mérito sin que nadie cambie una declaración</text>
