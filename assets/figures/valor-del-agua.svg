<text x="60" y="632" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">La curva no la dibuja nadie a mano: sale de simular la operación del sistema por el año hidrológico en curso más dos completos, y es la derivada</text>
<text x="60" y="650" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">de la función de costo futuro respecto del volumen al final de la semana (ROBCP 9.5.2 y 9.5.3). Solo se calcula para embalses que puedan generar</text>
<text x="60" y="668" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">al menos siete días a plena capacidad (9.5.5); las centrales de pasada no tienen valor del agua (9.5.4).</text>
<text x="60" y="690" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e737e" text-anchor="start">Curva ilustrativa. Los costos térmicos son los del parque de ejemplo del segundo artículo de la serie, no los de El Salvador.</text>
