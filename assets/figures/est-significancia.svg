<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
<rect width="1200" height="600" fill="#ffffff" />
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14161a" /></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5200" /></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7490" /></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e737e" /></marker></defs>
<text x="60" y="38" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#14161a" text-anchor="start">El valor p y el tamaño del efecto responden preguntas distintas</text>
<text x="60" y="60" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">reportar solo uno de los dos deja la mitad de la respuesta afuera</text>
<rect x="240" y="110" width="260" height="180" rx="0" fill="#f2f6f7" stroke="#d7dae0" stroke-width="1.2" />
<text x="258" y="140" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0e7490" text-anchor="start">Detectable y grande</text>
<text x="258" y="162" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">reportar y actuar</text>
<rect x="500" y="110" width="260" height="180" rx="0" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<text x="518" y="140" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a5200" text-anchor="start">Grande pero no detectable</text>
<text x="518" y="162" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">muestra insuficiente,</text>
<text x="518" y="178" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">no "no hay efecto"</text>
<rect x="240" y="290" width="260" height="180" rx="0" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<text x="258" y="320" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a5200" text-anchor="start">Detectable pero chico</text>
<text x="258" y="342" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">estadísticamente real,</text>
<text x="258" y="358" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">prácticamente irrelevante</text>
<rect x="500" y="290" width="260" height="180" rx="0" fill="#f7f7f8" stroke="#d7dae0" stroke-width="1.2" />
<text x="518" y="320" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#6e737e" text-anchor="start">Ni detectable ni grande</text>
<text x="518" y="342" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">no hay nada acá</text>
<line x1="240" y1="470" x2="760" y2="470" stroke="#b4b9c2" stroke-width="1.4" stroke-linecap="round" />
<line x1="240" y1="110" x2="240" y2="470" stroke="#b4b9c2" stroke-width="1.4" stroke-linecap="round" />
<line x1="500" y1="110" x2="500" y2="470" stroke="#14161a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" />
<line x1="240" y1="290" x2="760" y2="290" stroke="#14161a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" />
<text x="500" y="98" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600" fill="#14161a" text-anchor="middle">p = 0.05</text>
<text x="228" y="294" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600" fill="#14161a" text-anchor="end">d = 0.5</text>
<text x="500" y="504" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="middle">valor p        (izquierda: significativo)</text>
<text x="228" y="80" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="end">tamaño</text>
<text x="228" y="96" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="end">del efecto</text>
<circle cx="266" cy="202" r="6" fill="#14161a" />
<text x="280" y="206" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#14161a" text-anchor="start">desempleo 1980s vs 1990s</text>
<text x="280" y="223" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">d = 1.17   p = 1.5e-6</text>
<rect x="800" y="110" width="340" height="200" rx="6" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<text x="816" y="136" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#14161a" text-anchor="start">Qué significa d = 1.17</text>
