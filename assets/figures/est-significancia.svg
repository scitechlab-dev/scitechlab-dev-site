<text x="962.7973333333333" y="294" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#8a5200" text-anchor="middle">1980s</text>
<polyline points="824.0,265.0 827.2,263.0 830.5,260.8 833.7,258.3 837.0,255.6 840.2,252.5 843.5,249.2 846.7,245.5 850.0,241.6 853.2,237.4 856.4,232.9 859.7,228.2 862.9,223.4 866.2,218.3 869.4,213.2 872.7,208.0 875.9,202.9 879.2,197.8 882.4,192.9 885.6,188.2 888.9,183.8 892.1,179.7 895.4,176.1 898.6,172.9 901.9,170.3 905.1,168.3 908.4,166.9 911.6,166.1 914.8,166.0 918.1,166.6 921.3,167.8 924.6,169.7 927.8,172.1 931.1,175.1 934.3,178.6 937.6,182.5 940.8,186.8 944.0,191.4 947.3,196.3 950.5,201.3 953.8,206.5 957.0,211.7 960.3,216.8 963.5,221.9 966.8,226.8 970.0,231.5 973.2,236.1 976.5,240.4 979.7,244.4 983.0,248.1 986.2,251.5 989.5,254.7 992.7,257.5 996.0,260.1 999.2,262.4 1002.4,264.4 1005.7,266.2 1008.9,267.8 1012.2,269.1 1015.4,270.3 1018.7,271.3 1021.9,272.1 1025.2,272.8 1028.4,273.4 1031.6,273.9 1034.9,274.3 1038.1,274.7 1041.4,275.0 1044.6,275.2 1047.9,275.4 1051.1,275.5 1054.4,275.6 1057.6,275.7 1060.8,275.8 1064.1,275.8 1067.3,275.9 1070.6,275.9 1073.8,275.9 1077.1,275.9 1080.3,276.0 1083.6,276.0 1086.8,276.0 1090.0,276.0 1093.3,276.0 1096.5,276.0 1099.8,276.0 1103.0,276.0 1106.3,276.0 1109.5,276.0 1112.8,276.0 1116.0,276.0" fill="none" stroke="#0e7490" stroke-width="2.2" />
<line x1="913.7088888888889" y1="276" x2="913.7088888888889" y2="166" stroke="#0e7490" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" />
<text x="913.7088888888889" y="294" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#0e7490" text-anchor="middle">1990s</text>
<line x1="824" y1="276" x2="1116" y2="276" stroke="#b4b9c2" stroke-width="1.4" stroke-linecap="round" />
<text x="816" y="332" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">Poco más de una desviación estándar separa a las</text>
<text x="816" y="348" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">dos décadas. El desempleo MEDIO de los ochenta</text>
<text x="816" y="364" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">supera al 88 % de los trimestres de los noventa;</text>
<text x="816" y="380" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">un trimestre cualquiera, al 80 %. Las dos cifras</text>
<text x="816" y="396" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">salen de la misma d y no son la misma pregunta.</text>
<line x1="60" y1="512" x2="1140" y2="512" stroke="#d7dae0" stroke-width="1.4" stroke-linecap="round" />
<text x="60" y="538" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">El cuadrante superior derecho es el que más daño hace, porque se reporta como "no hay diferencia" cuando lo correcto es "esta muestra no</text>
<text x="60" y="556" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">alcanza para detectarla". Ausencia de evidencia no es evidencia de ausencia, y la manera de distinguirlas es mirar el tamaño del efecto.</text>
<text x="60" y="580" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#8a5200" text-anchor="start">Con 10 pruebas al 5 %, la probabilidad de al menos un falso positivo es 40.1 %. Contar cuántas pruebas se hicieron es parte del reporte.</text>
</svg>