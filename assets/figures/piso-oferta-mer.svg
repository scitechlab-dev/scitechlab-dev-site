<text x="60" y="222" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#565a63" text-anchor="start">La misma unidad de los dos</text>
<text x="60" y="240" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#565a63" text-anchor="start">artículos anteriores: 60 MW,</text>
<text x="60" y="258" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#565a63" text-anchor="start">fuel oil, evaluada a 58.2 MW</text>
<text x="60" y="282" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="600" fill="#14161a" text-anchor="start">CV = 128.11 USD/MWh</text>
<line x1="60" y1="462" x2="1140" y2="462" stroke="#d7dae0" stroke-width="1.4" stroke-linecap="round" />
<text x="60" y="488" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">Tres reglas más acotan la oferta, y las tres apuntan a lo mismo: que exportar no sea una forma de esquivar la validación nacional.</text>
<text x="60" y="510" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">La cantidad ofertada no puede superar la cantidad ofertable que la UT informa (11.4.4.1.2). La oferta no puede provenir de unidades bajo prueba,</text>
<text x="60" y="528" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">en mantenimiento o indisponibles (11.4.4.1.4). Y la inyección hidráulica al MER solo puede venir de centrales que estén vertiendo o que la</text>
<text x="60" y="546" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">programación prevea que llegarán a esa condición (11.4.4.1.3): no se vacía un embalse para vender afuera.</text>
<text x="60" y="574" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e737e" text-anchor="start">Csis y precio del MER ilustrativos. El CVC y el CVNC son los que salieron resueltos en los artículos III y IV de esta serie.</text>
