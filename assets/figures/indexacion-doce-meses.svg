<text x="136" y="186" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#14161a" text-anchor="start">        + 0.65 · PPI(i)/PPI(0)</text>
<text x="136" y="204" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">la ponderación la valida el auditor</text>
<line x1="60" y1="520" x2="1140" y2="520" stroke="#d7dae0" stroke-width="1.4" stroke-linecap="round" />
<text x="60" y="548" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13.5" font-weight="400" fill="#14161a" text-anchor="start">CVNC(0) = 6.80 USD/MWh   ×   factor 1.0369   =   CVNC(12) = 7.05 USD/MWh</text>
<text x="60" y="574" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">Veinticinco centavos en un año. El PPI pesa el doble que el IPC porque los repuestos son importados, y por eso el factor se</text>
<text x="60" y="592" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">pega a la curva ámbar y no a la de en medio. Cambiar esa ponderación mueve más el resultado que cambiar los índices.</text>
<text x="60" y="618" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">Índices ilustrativos. Las fuentes reales son la DIGESTYC para el IPC y la serie PCUOMFG del Bureau of Labor Statistics para el PPI.</text>
