<text x="60" y="430" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">La diferencia que importa: pivot FALLA si hay claves duplicadas, y pivot_table las agrega en silencio. Si no se sabe cuál se está</text>
<text x="60" y="448" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">usando, un promedio que nadie pidió puede colarse en el resultado. Cuando quiero una reorganización pura uso pivot, justamente</text>
<text x="60" y="466" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">porque falla.</text>
