<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect width="1200" height="520" fill="#ffffff" />
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14161a" /></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5200" /></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7490" /></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e737e" /></marker></defs>
<text x="60" y="38" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#14161a" text-anchor="start">Qué rompe un programa ya publicado</text>
<text x="60" y="60" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">los dos mecanismos de corrección no son intercambiables: uno rehace la semana, el otro rehace lo que queda del día</text>
<rect x="60" y="92" width="520" height="300" rx="8" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="60" y="92" width="520" height="3" rx="1.5" fill="#8a5200" stroke="none" stroke-width="1.2" />
<text x="82" y="122" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#8a5200" text-anchor="start" letter-spacing="0.08em">REPROGRAMACIÓN SEMANAL</text>
<text x="558" y="122" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="400" fill="#6e737e" text-anchor="end">ROBCP 9.2.1</text>
<text x="82" y="146" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#14161a" text-anchor="start">Vale por el resto de la semana en curso</text>
<circle cx="87" cy="174" r="3" fill="#8a5200" />
<text x="102" y="178" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">La generación hidroeléctrica acumulada desde el</text>
<text x="102" y="194" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">inicio de la semana difiere en más de 5 % de la</text>
<text x="102" y="210" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">programada para el mismo período</text>
<circle cx="87" cy="238" r="3" fill="#8a5200" />
<text x="102" y="242" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">Cambios significativos en caudales afluentes,</text>
<text x="102" y="258" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">disponibilidad de unidades o líneas, o en las</text>
<text x="102" y="274" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">transacciones regionales, que muevan el valor del agua</text>
<circle cx="87" cy="302" r="3" fill="#8a5200" />
<text x="102" y="306" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">El propietario de una central señala riesgo de</text>
<text x="102" y="322" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">vertimiento o de agotamiento del embalse no previsto</text>
<rect x="620" y="92" width="520" height="300" rx="8" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="620" y="92" width="520" height="3" rx="1.5" fill="#14161a" stroke="none" stroke-width="1.2" />
<text x="642" y="122" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#14161a" text-anchor="start" letter-spacing="0.08em">REDESPACHO</text>
<text x="1118" y="122" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="400" fill="#6e737e" text-anchor="end">ROBCP 13.10.1</text>
<text x="642" y="146" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#14161a" text-anchor="start">Vale para lo que resta del día</text>
<circle cx="647" cy="174" r="3" fill="#14161a" />
<text x="662" y="178" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">Indisponibilidad confirmada de una unidad con energía</text>
<text x="662" y="194" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">asignada, por tres intervalos consecutivos o más, que</text>
<text x="662" y="210" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">represente al menos el margen de reserva rodante</text>
<circle cx="647" cy="238" r="3" fill="#14161a" />
<text x="662" y="242" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">Diferencia entre demanda pronosticada y real mayor</text>
<text x="662" y="258" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">que el porcentaje de reserva rodante</text>
<circle cx="647" cy="286" r="3" fill="#14161a" />
<text x="662" y="290" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">Indisponibilidad de un elemento de transmisión por</text>
<text x="662" y="306" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">más de cuatro intervalos consecutivos que afecte los</text>
<text x="662" y="322" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">parámetros de operación normal</text>
<circle cx="647" cy="350" r="3" fill="#14161a" />
<text x="662" y="354" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">Solicitudes o redespachos en el mercado regional que</text>
<text x="662" y="370" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">afecten las transacciones programadas</text>
<rect x="60" y="412" width="1080" height="76" rx="8" fill="#ffffff" stroke="#b4b9c2" stroke-width="1.2" />
<text x="82" y="440" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#14161a" text-anchor="start">Y un caso que no dispara ninguno de los dos</text>
<text x="82" y="462" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">Si los caudales reales se desvían de los pronosticados y las cotas se apartan de lo esperado, pero el propietario no prevé vertimiento, no hace falta</text>
<text x="82" y="480" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">redespachar en tiempo real: el ajuste se programa en los predespachos de los días siguientes (13.10.3).</text>
</svg>