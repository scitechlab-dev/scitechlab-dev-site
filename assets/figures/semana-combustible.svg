<text x="440.3714285714286" y="172" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Reporte del PCpep</text>
<text x="440.3714285714286" y="194" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">antes de las 10:00, en el formulario del</text>
<text x="440.3714285714286" y="210" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">Anexo 06. Se publica, no despacha</text>
<text x="440.3714285714286" y="230" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 04, 10.1</text>
