<text x="514.657142857143" y="316" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Precio de la programación semanal</text>
<text x="514.657142857143" y="338" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">lo calcula la UT con la fórmula</text>
<text x="514.657142857143" y="354" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">aprobada. Ese es el que despacha</text>
<text x="514.657142857143" y="374" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="400" fill="#6e737e" text-anchor="start">Anexo 04, 11.2</text>
