<text x="80" y="442" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0e7490" text-anchor="start" letter-spacing="0.08em">TODOS LOS DÍAS, 8 A 9 H</text>
<text x="270" y="442" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">la UT publica los PCpep reportados por cada participante para el día en curso, junto con el nivel de los embalses</text>
<text x="1120" y="442" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="400" fill="#6e737e" text-anchor="end">Anexo 04, 11.1</text>
<text x="60" y="476" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">Las dos cifras del jueves son distintas y las dos son públicas. La que reporta el generador cumple el artículo 60 literal c de la Ley General</text>
<text x="60" y="494" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">de Electricidad y no se usa en la programación (Anexo 06, 7.4.3.7.1). La que calcula la UT rige los siete días de la semana programada (7.1).</text>
