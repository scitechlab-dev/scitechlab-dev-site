<text x="510" y="241" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">entrenamiento</text>
<text x="751.4000000000001" y="241" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">7 d</text>
