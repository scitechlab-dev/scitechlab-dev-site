<text x="60" y="38" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#14161a" text-anchor="start">Por qué origen móvil y no una partición al azar</text>
<text x="60" y="60" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">en una serie de tiempo, partir al azar deja días futuros dentro del entrenamiento, y la métrica sale espectacular por la razón equivocada</text>
