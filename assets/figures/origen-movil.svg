<text x="300" y="168" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e737e" text-anchor="start">prueba en ámbar, entrenamiento en gris: están intercalados, así que el entrenamiento contiene días posteriores a los de prueba</text>
<text x="60" y="216" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#14161a" text-anchor="start">Origen móvil</text>
<text x="60" y="236" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#0e7490" text-anchor="start">cada corte reproduce</text>
<text x="60" y="252" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#0e7490" text-anchor="start">la situación real</text>
<rect x="300" y="224" width="420" height="26" rx="2" fill="#b4b9c2" stroke="none" stroke-width="1.2" />
