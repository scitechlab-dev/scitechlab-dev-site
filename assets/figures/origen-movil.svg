<rect x="300" y="384" width="722.4" height="26" rx="2" fill="#b4b9c2" stroke="none" stroke-width="1.2" />
<rect x="1024.4" y="384" width="58.800000000000004" height="26" rx="2" fill="#0e7490" stroke="none" stroke-width="1.2" />
<text x="286" y="401" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="400" fill="#6e737e" text-anchor="end">origen 5</text>
<text x="300" y="436" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">y así 26 veces, una por semana. En cada una el modelo se reajusta con todo lo anterior al origen y pronostica los 7 días siguientes.</text>
<line x1="60" y1="486" x2="1140" y2="486" stroke="#d7dae0" stroke-width="1.4" stroke-linecap="round" />
<text x="60" y="512" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">26 orígenes × 7 días = 182 pronósticos evaluados por modelo, de 2025-07-03 a 2025-12-25.</text>
<text x="60" y="534" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">El costo es tiempo de cómputo: cada origen exige reajustar el modelo entero. Es la diferencia entre medir un modelo y medir un experimento.</text>
