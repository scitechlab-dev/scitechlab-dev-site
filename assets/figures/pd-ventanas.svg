<text x="84" y="371" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#14161a" text-anchor="start">La fila ámbar es la única que no se puede usar para pronosticar: para calcular el valor de t necesita datos de t+1 y t+2,</text>
<text x="84" y="389" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">que en producción todavía no existen. Para describir el pasado en una gráfica está bien, y de hecho es lo correcto porque no</text>
<text x="84" y="407" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#565a63" text-anchor="start">desfasa la curva.</text>
<text x="60" y="436" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">expanding y ewm leen las mismas celdas: la diferencia es el peso. En ewm el degradado del color ES el peso, y por eso reacciona</text>
<text x="60" y="454" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">más rápido a un cambio reciente sin perder del todo la memoria de lo viejo.</text>
