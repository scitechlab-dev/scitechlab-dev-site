<text x="60" y="38" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#14161a" text-anchor="start">Qué pasado lee cada ventana, y cuál mira al futuro</text>
<text x="60" y="60" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">cada fila es la misma serie; lo sombreado es lo que se usa para calcular el valor del período marcado</text>
<text x="323" y="90" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="400" fill="#6e737e" text-anchor="middle">t−8</text>
