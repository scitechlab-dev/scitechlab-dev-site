<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
<rect width="1200" height="600" fill="#ffffff" />
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14161a" /></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5200" /></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7490" /></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e737e" /></marker></defs>
<text x="60" y="38" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#14161a" text-anchor="start">Lo que cambió en abril de 2026: el mercado minorista y el contrato de abastecimiento en distribución</text>
<text x="60" y="60" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">Decreto 548. Reordena quién decide qué sobre la generación conectada a la red de distribución, y le da a la distribuidora obligaciones nuevas</text>
<rect x="60" y="96" width="320" height="300" rx="8" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="60" y="96" width="320" height="3" rx="1.5" fill="#0e7490" stroke="none" stroke-width="1.2" />
<text x="76" y="124" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0e7490" text-anchor="start" letter-spacing="0.08em">DGEHM</text>
<text x="76" y="156" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#0e7490" text-anchor="start">32-B</text>
<text x="122" y="156" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">emite los lineamientos de los procesos</text>
<text x="122" y="170" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">competitivos y fija los precios de los CAD</text>
<text x="76" y="202" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#0e7490" text-anchor="start">32-C</text>
<text x="122" y="202" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">responsable de los estudios de integración</text>
<text x="122" y="216" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">que fijan la capacidad máxima por circuito</text>
<text x="76" y="248" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#0e7490" text-anchor="start">28-A</text>
<text x="122" y="248" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">regula los cargos de interconexión de</text>
<text x="122" y="262" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">generación distribuida</text>
<rect x="440" y="96" width="320" height="300" rx="8" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="440" y="96" width="320" height="3" rx="1.5" fill="#8a5200" stroke="none" stroke-width="1.2" />
<text x="456" y="124" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#8a5200" text-anchor="start" letter-spacing="0.08em">DISTRIBUIDORA</text>
<text x="456" y="156" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#8a5200" text-anchor="start">32-A</text>
<text x="502" y="156" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">es la única compradora posible: el generador</text>
<text x="502" y="170" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">distribuido del minorista solo puede venderle</text>
<text x="502" y="184" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">a ella</text>
<text x="456" y="216" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#8a5200" text-anchor="start">32-B</text>
<text x="502" y="216" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">debe suscribir los contratos que resulten</text>
<text x="502" y="230" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">de los procesos</text>
<text x="456" y="262" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#8a5200" text-anchor="start">32-D</text>
<text x="502" y="262" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">pone a disposición de la UT las señales de</text>
<text x="502" y="276" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">registro, monitoreo y control de esas plantas</text>
<text x="456" y="308" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#8a5200" text-anchor="start">32-K</text>
<text x="502" y="308" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">entrega la información de sus redes para los</text>
<text x="502" y="322" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">estudios de integración, actualizada</text>
<text x="456" y="354" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#8a5200" text-anchor="start">28-A</text>
<text x="502" y="354" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">revisa sin costo adicional los estudios de</text>
<text x="502" y="368" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">interconexión que haga un tercero</text>
<rect x="820" y="96" width="320" height="300" rx="8" fill="#f6f7f9" stroke="#d7dae0" stroke-width="1.2" />
<rect x="820" y="96" width="320" height="3" rx="1.5" fill="#14161a" stroke="none" stroke-width="1.2" />
<text x="836" y="124" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#14161a" text-anchor="start" letter-spacing="0.08em">GENERADOR DISTRIBUIDO</text>
<text x="836" y="156" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#14161a" text-anchor="start">32-D</text>
<text x="882" y="156" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">entrega a la distribuidora las señales de</text>
<text x="882" y="170" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">registro, monitoreo y control</text>
<text x="836" y="202" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#14161a" text-anchor="start">32-E</text>
<text x="882" y="202" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">aporta reserva de regulación primaria y</text>
<text x="882" y="216" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">secundaria, propia o comprada</text>
<text x="836" y="248" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#14161a" text-anchor="start">32-I</text>
<text x="882" y="248" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">instala medición comercial conforme al</text>
<text x="882" y="262" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">Reglamento de Operación</text>
<text x="836" y="294" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#14161a" text-anchor="start">32-H</text>
<text x="882" y="294" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">puede instalar almacenamiento para dar su</text>
<text x="882" y="308" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#565a63" text-anchor="start">propia reserva</text>
<rect x="60" y="420" width="520" height="96" rx="8" fill="#ffffff" stroke="#b4b9c2" stroke-width="1.2" />
<text x="80" y="448" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#8a5200" text-anchor="start">32-A</text>
<text x="126" y="448" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#14161a" text-anchor="start">Una planta no puede estar en los dos mercados a la vez</text>
<text x="80" y="472" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">mayorista o minorista, no ambos. La decisión de en cuál entrar</text>
<text x="80" y="488" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">es de una sola vez y condiciona todo lo demás.</text>
<rect x="620" y="420" width="520" height="96" rx="8" fill="#ffffff" stroke="#b4b9c2" stroke-width="1.2" />
<text x="640" y="448" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#8a5200" text-anchor="start">32-G</text>
<text x="686" y="448" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#14161a" text-anchor="start">El generador con CAD no participa en capacidad firme</text>
<text x="640" y="472" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">no se le reconoce potencia firme, así que su retribución sale</text>
<text x="640" y="488" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#565a63" text-anchor="start">entera del contrato y no del mecanismo de confiabilidad.</text>
<text x="60" y="554" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">El artículo 32-A convierte a la distribuidora en compradora única de la generación distribuida del mercado minorista, pero el 32-B le quita el</text>
<text x="60" y="572" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e737e" text-anchor="start">precio y la obliga a suscribir. Es una posición monopsónica sin margen de negociación: todo el poder de decisión está aguas arriba.</text>
</svg>