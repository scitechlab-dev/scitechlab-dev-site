# Running order for the mercado-eléctrico series.
#
# This manifest is the source of truth for WHAT the series contains and in which
# order. It is not the source of truth for what is WRITTEN: the build matches
# each `slug` against content/, and an entry with no matching article renders as
# "sin escribir" with no link. A written article's status comes from its own
# `estado:` front matter, never from here — so this file cannot claim something
# is published when the file does not exist.
#
# Slugs follow the site convention: lowercase, digits and dashes. The article
# file may carry a YYYY-MM-DD- prefix for ordering on disk; the slug never does.

slug: mercado-electrico
title: Mercado eléctrico mayorista de El Salvador
lang: es
summary: >-
  Ocho artículos de estudio sobre cómo se despacha, se cuesta y se liquida la
  energía en el mercado mayorista salvadoreño. Cuaderno público, no divulgación.

articulos:
  - slug: quien-es-quien-mercado-electrico-salvadoreno
    titulo: Quién es quién en el mercado eléctrico salvadoreño
    resumen: >-
      Separación de actividades, competencias de la UT frente a las del
      regulador, el traslado de SIGET a la DGEHM en 2026, y por qué el país
      valoriza a costos de producción y no a ofertas.

  - slug: orden-de-merito-costo-marginal
    titulo: Del orden de mérito al precio, cómo se forma el costo marginal
    resumen: >-
      Curva de oferta agregada, costo marginal de corto plazo y un despacho de
      cuatro unidades resuelto, con mínimo técnico y restricción de transmisión.

  - slug: declaracion-semanal-precio-combustible
    titulo: Anatomía de una declaración semanal de precio de combustible
    resumen: >-
      De la auditoría bienal de consumo de calor a la declaración del jueves:
      curva de consumo específico, precio puesto en planta armado componente
      por componente, e inventarios atados a la cota del embalse.

  - slug: indexacion-costos-variables-no-combustibles
    titulo: Indexación de costos variables no combustibles, paso a paso
    resumen: >-
      Cómo se separa un costo fijo de uno variable, la fórmula mensual de IPC
      y PPI resuelta a doce meses, y el ajuste por despacho real que mueve el
      CVNC más que la inflación. Costos de arranque y detención.

  - slug: horizontes-programacion-operacion
    titulo: Los horizontes de la programación de la operación
    resumen: >-
      Son tres, no cuatro: qué decide cada uno y qué ya no puede decidir el
      siguiente, el valor del agua calculado en dos fases, y qué rompe un
      programa ya publicado.

  - slug: mercado-electrico-regional
    titulo: Cómo se conecta El Salvador al mercado eléctrico regional
    resumen: >-
      Un enlace exportador se modela como demanda inflexible y uno importador
      como generador inflexible. Además, el piso que impide exportar bajo costo
      y el recorrido de un MWh hasta el documento de transacciones económicas.

  - slug: validacion-datos-operativos-python
    titulo: Validación automática de datos operativos con Python
    resumen: >-
      Doce reglas atadas a su numeral del ROBCP, cuatro ámbitos, un criterio
      para separar rechazo de alerta, y la corrida real sobre 48 declaraciones
      sintéticas con doce defectos sembrados. Con código que corre.

  - slug: pronostico-demanda-electrica
    titulo: Pronóstico de demanda eléctrica, comparación honesta de tres enfoques
    resumen: >-
      Validación con origen móvil sobre 182 pronósticos por modelo. El boosting
      perdió contra la línea base hasta encontrar un error de alineación, el
      SARIMAX ganó por una razón que sesga la comparación, y los intervalos
      cubren 59 % cuando deberían cubrir 80 %.
